[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanmames"
version = "0.1.0"
description = "Simulación de eventos discretos (SimPy) del acceso, salida e incidencias en San Mamés"
requires-python = ">=3.10"
dependencies = ["simpy>=4.1", "numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
